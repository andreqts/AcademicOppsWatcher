[project]
name = "opportunity-watch"
version = "0.1.0"
description = "Daily watch for academic job openings in Foz do Iguaçu, PR"
requires-python = ">=3.12"
dependencies = ["ddgs", "pyyaml", "requests"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opportunity_watch"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", ".claude", ".cursor", ".windsurf", ".agents", ".tlc"]
